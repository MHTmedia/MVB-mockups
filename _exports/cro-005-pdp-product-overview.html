  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

29, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"9a1f9d76-12d9-4c21-9d2e-9031691f7e4b\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"4abf66a7-175b-4ce2-add6-a596e63b8f50\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n<style>/* Mad Viking Beard Co. — Color tokens\n   Source: madvikingbeard.fig (Homepage + PDP frames) */\n\n:root {\n  /* ── Base palette ─────────────────────────────── */\n  --mv-black: rgb(0, 0, 0);            /* page + section background */\n  --mv-ink-900: rgb(17, 17, 17);       /* slideshow backdrop */\n  --mv-ink-850: rgb(23, 22, 21);       /* newsletter band */\n  --mv-ink-800: rgb(23, 23, 23);       /* cart empty-state panel */\n  --mv-white: rgb(255, 255, 255);      /* primary text, inset frames */\n\n  --mv-red: rgb(179, 0, 0);            /* brand red — CTAs, badges, sale prices, stars */\n  --mv-red-deep: rgb(160, 0, 0);       /* nav \"Best Offer\" pill */\n\n  /* ── Grays (text on black) ────────────────────── */\n  --mv-gray-100: rgb(235, 235, 235);\n  --mv-gray-150: rgb(238, 238, 238);   /* progress-bar track, light borders on white */\n  --mv-gray-300: rgb(212, 212, 212);   /* breadcrumb dividers/current page */\n  --mv-gray-400: rgb(204, 204, 204);   /* light strokes */\n  --mv-gray-500: rgb(154, 154, 154);\n  --mv-gray-550: rgb(153, 153, 153);   /* compare-at prices, countdown labels */\n  --mv-gray-600: rgb(115, 115, 115);\n  --mv-gray-800: rgb(51, 51, 51);      /* dark text on white surfaces (GovX strip) */\n\n  /* ── The signature hairline ───────────────────── */\n  --mv-border: rgb(43, 42, 39);        /* warm near-black hairline on everything */\n\n  /* ── Semantic aliases ─────────────────────────── */\n  --surface-page: var(--mv-black);\n  --surface-raised: var(--mv-ink-800);\n  --surface-band: var(--mv-ink-850);\n  --surface-inverse: var(--mv-white);\n\n  --text-primary: var(--mv-white);\n  --text-muted: var(--mv-gray-550);\n  --text-dim: var(--mv-gray-300);\n  --text-on-inverse: var(--mv-gray-800);\n  --text-accent: var(--mv-red);\n\n  --accent: var(--mv-red);\n  --accent-strong: var(--mv-red-deep);\n\n  --border-hairline: 1px solid var(--mv-border);\n\n  /* ── Overlays / protection ────────────────────── */\n  --overlay-photo: rgba(0, 0, 0, 0.15);             /* flat scrim over hero/banner photos */\n  --overlay-text-halo: radial-gradient(closest-side, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0) 60%); /* soft halo behind hero copy */\n  --overlay-modal: rgba(0, 0, 0, 0.7);              /* cart-drawer page dim */\n}\n<\u002Fstyle>\n<style>/* Mad Viking Beard Co. — Typography tokens\n   Display: Fjalla One (always wide-tracked, usually uppercase)\n   Body/UI: Inter (small sizes, generous letter-spacing) */\n\n:root {\n  --font-display: \"Fjalla One\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  --font-body: \"Inter\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n\n  /* ── Display scale (Fjalla One) ───────────────── */\n  --text-hero: 38.3px;            /* section headers, H1/H2  */\n  --text-hero-leading: 1.2;\n  --text-hero-tracking: 0.15em;   /* 5.74px @ 38.3px */\n\n  --text-subhero: 30.2px;         /* newsletter \"Sign up and save!\" */\n  --text-subhero-tracking: 0.15em;\n\n  --text-title: 20px;             /* cart title, drawer headers */\n  --text-title-tracking: 0.15em;\n\n  --text-nav: 18px;               /* primary nav links */\n  --text-nav-tracking: 0.15em;\n\n  --text-card-title: 16px;        /* product card titles, ls 3.2px */\n  --text-card-title-tracking: 0.2em;\n  --text-card-title-leading: 1.0;\n\n  /* ── Body scale (Inter) ───────────────────────── */\n  --text-body: 13.8px;            /* paragraphs; 25.2px line-height */\n  --text-body-leading: 1.83;\n  --text-body-tracking: 0.065em;  /* 0.9px — applied to nearly all Inter text */\n\n  --text-detail: 11.8px;          /* PDP fine print, accordion bodies */\n  --text-detail-leading: 1.82;\n\n  --text-price: 15.3px;           /* prices (weight 500) */\n\n  /* ── Wide-tracked smallcaps (Inter, uppercase) ── */\n  --text-eyebrow: 11.2px;         /* footer column titles */\n  --text-eyebrow-tracking: 0.36em; /* 4.05px */\n\n  --text-button: 11px;            /* button labels */\n  --text-button-tracking: 0.38em; /* 4.2px */\n\n  --text-micro: 9.8px;            /* copyright, countdown sublabel */\n  --text-micro-tracking: 0.09em;\n}\n\n/* Ready-made classes used across cards and kits */\n.mv-display {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: var(--text-hero);\n  line-height: var(--text-hero-leading);\n  letter-spacing: var(--text-hero-tracking);\n  color: var(--text-primary);\n  text-transform: uppercase;\n}\n\n.mv-body {\n  font-family: var(--font-body);\n  font-size: var(--text-body);\n  line-height: var(--text-body-leading);\n  letter-spacing: var(--text-body-tracking);\n  color: var(--text-primary);\n}\n\n.mv-eyebrow {\n  font-family: var(--font-body);\n  font-size: var(--text-eyebrow);\n  letter-spacing: var(--text-eyebrow-tracking);\n  text-transform: uppercase;\n  color: var(--text-primary);\n}\n<\u002Fstyle>\n<style>/* Mad Viking Beard Co. — Spacing, radii, effects */\n\n:root {\n  /* ── Layout ───────────────────────────────────── */\n  --page-max: 1500px;\n  --page-pad-x: 40px;\n  --section-gap: 75px;        /* vertical rhythm between sections */\n  --header-gap: 50px;         /* section header → content */\n  --grid-gap: 22px;           /* product grid gutter */\n\n  /* ── Radii — the brand is square-cornered ─────── */\n  --radius-none: 0;           /* default: buttons, cards, badges, inputs */\n  --radius-pill-sm: 3px;      /* tiny nav \"Best Offer\" pill */\n  --radius-drawer: 15px;      /* cart flyout */\n  --radius-bar: 10px;         /* progress bar */\n\n  /* ── The axe-cut (skewed button edges) ────────── */\n  --skew-btn: -12deg;         /* @kind other */ /* matrix(1,0,-0.208,0.978) ≈ skewX(-12°) */\n\n  /* ── Frames & shadows ─────────────────────────── */\n  --frame-inset-white: inset 0 0 0 12px var(--mv-white);  /* promo-grid white frame */\n  --shadow-header: 0 0 1px 0 rgba(0, 0, 0, 0.2);          /* sticky header */\n\n  /* ── Motion ───────────────────────────────────── */\n  --ease-site: ease;          /* @kind other */ /* theme uses simple CSS ease */\n  --dur-fast: 150ms;          /* @kind other */ /* hovers: opacity/color */\n  --dur-med: 300ms;           /* @kind other */ /* drawers, accordions */\n}\n<\u002Fstyle>\n<style>/* Mad Viking Beard Co. — base element styles shared by cards & kits */\n\n.mv-page {\n  background: var(--surface-page);\n  color: var(--text-primary);\n  font-family: var(--font-body);\n  font-size: var(--text-body);\n  line-height: var(--text-body-leading);\n  letter-spacing: var(--text-body-tracking);\n}\n\n/* ── Axe-cut button (signature parallelogram) ──────────────\n   Primary: solid red. Ghost: 1px hairline outline.\n   The slanted silhouette comes from a skewed background layer;\n   the label stays unskewed. */\n.mv-btn {\n  position: relative;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  min-width: 90px;\n  height: 42px;\n  padding: 0 20px;\n  border: none;\n  background: transparent;\n  font-family: var(--font-body);\n  font-size: var(--text-button);\n  letter-spacing: var(--text-button-tracking);\n  text-transform: uppercase;\n  text-indent: var(--text-button-tracking); /* optically recenter wide tracking */\n  color: var(--mv-white);\n  cursor: pointer;\n  text-decoration: none;\n  white-space: nowrap;\n}\n.mv-btn::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background: var(--mv-red);\n  transform: skewX(var(--skew-btn));\n  transition: background-color var(--dur-fast) var(--ease-site), opacity var(--dur-fast) var(--ease-site);\n  z-index: -1;\n}\n.mv-btn:hover::before { background: var(--mv-red-deep); }\n.mv-btn:active::before { background: rgb(140, 0, 0); }\n\n.mv-btn--ghost::before {\n  background: transparent;\n  border: 1px solid var(--mv-border);\n}\n.mv-btn--ghost:hover::before { background: rgba(255, 255, 255, 0.06); }\n.mv-btn--ghost:active::before { background: rgba(255, 255, 255, 0.1); }\n.mv-btn--ghost { height: 34px; font-size: 9.6px; letter-spacing: 0.36em; text-indent: 0.36em; }\n\n.mv-btn--straight::before { transform: none; } /* PDP add-to-cart is square */\n\n/* ── Inputs ───────────────────────────────────── */\n.mv-input {\n  height: 43px;\n  padding: 10px 11px;\n  background: transparent;\n  border: var(--border-hairline);\n  border-radius: var(--radius-none);\n  font-family: var(--font-body);\n  font-size: 14.3px;\n  letter-spacing: var(--text-body-tracking);\n  color: var(--mv-white);\n  outline: none;\n}\n.mv-input::placeholder { color: var(--mv-white); opacity: 0.9; }\n.mv-input:focus { border-color: var(--mv-gray-400); }\n\n/* ── Links ────────────────────────────────────── */\n.mv-link {\n  color: var(--mv-white);\n  text-decoration: none;\n  transition: opacity var(--dur-fast) var(--ease-site);\n}\n.mv-link:hover { opacity: 0.7; }\n.mv-link--accent { color: var(--mv-red); }\n<\u002Fstyle>\n<style>/* Mad Viking Beard Co. — Webfonts\n   Both families ship on Google Fonts; the .fig uses Fjalla One Regular\n   and Inter Regular/Medium/Bold/Italic. */\n\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Fjalla One';\n  font-sty ly: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"4abf66a7-175b-4ce2-add6-a596e63b8f50\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Mad Viking Beard Co. — Color tokens\n   Source: madvikingbeard.fig (Homepage + PDP frames) */\n\n:root {\n  /* ── Base palette ─────────────────────────────── */\n  --mv-black: rgb(0, 0, 0);            /* page + section background */\n  --mv-ink-900: rgb(17, 17, 17);       /* slideshow backdrop */\n  --mv-ink-850: rgb(23, 22, 21);       /* newsletter band */\n  --mv-ink-800: rgb(23, 23, 23);       /* cart empty-state panel */\n  --mv-white: rgb(255, 255, 255);      /* primary text, inset frames */\n\n  --mv-red: rgb(179, 0, 0);            /* brand red — CTAs, badges, sale prices, stars */\n  --mv-red-deep: rgb(160, 0, 0);       /* nav \"Best Offer\" pill */\n\n  /* ── Grays (text on black) ────────────────────── */\n  --mv-gray-100: rgb(235, 235, 235);\n  --mv-gray-150: rgb(238, 238, 238);   /* progress-bar track, light borders on white */\n  --mv-gray-300: rgb(212, 212, 212);   /* breadcrumb dividers/current page */\n  --mv-gray-400: rgb(204, 204, 204);   /* light strokes */\n  --mv-gray-500: rgb(154, 154, 154);\n  --mv-gray-550: rgb(153, 153, 153);   /* compare-at prices, countdown labels */\n  --mv-gray-600: rgb(115, 115, 115);\n  --mv-gray-800: rgb(51, 51, 51);      /* dark text on white surfaces (GovX strip) */\n\n  /* ── The signature hairline ───────────────────── */\n  --mv-border: rgb(43, 42, 39);        /* warm near-black hairline on everything */\n\n  /* ── Semantic aliases ─────────────────────────── */\n  --surface-page: var(--mv-black);\n  --surface-raised: var(--mv-ink-800);\n  --surface-band: var(--mv-ink-850);\n  --surface-inverse: var(--mv-white);\n\n  --text-primary: var(--mv-white);\n  --text-muted: var(--mv-gray-550);\n  --text-dim: var(--mv-gray-300);\n  --text-on-inverse: var(--mv-gray-800);\n  --text-accent: var(--mv-red);\n\n  --accent: var(--mv-red);\n  --accent-strong: var(--mv-red-deep);\n\n  --border-hairline: 1px solid var(--mv-border);\n\n  /* ── Overlays / protection ────────────────────── */\n  --overlay-photo: rgba(0, 0, 0, 0.15);             /* flat scrim over hero/banner photos */\n  --overlay-text-halo: radial-gradient(closest-side, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0) 60%); /* soft halo behind hero copy */\n  --overlay-modal: rgba(0, 0, 0, 0.7);              /* cart-drawer page dim */\n}\n\n/* Mad Viking Beard Co. — Typography tokens\n   Display: Fjalla One (always wide-tracked, usually uppercase)\n   Body/UI: Inter (small sizes, generous letter-spacing) */\n\n:root {\n  --font-display: \"Fjalla One\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  --font-body: \"Inter\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n\n  /* ── Display scale (Fjalla One) ───────────────── */\n  --text-hero: 38.3px;            /* section headers, H1/H2  */\n  --text-hero-leading: 1.2;\n  --text-hero-tracking: 0.15em;   /* 5.74px @ 38.3px */\n\n  --text-subhero: 30.2px;         /* newsletter \"Sign up and save!\" */\n  --text-subhero-tracking: 0.15em;\n\n  --text-title: 20px;             /* cart title, drawer headers */\n  --text-title-tracking: 0.15em;\n\n  --text-nav: 18px;               /* primary nav links */\n  --text-nav-tracking: 0.15em;\n\n  --text-card-title: 16px;        /* product card titles, ls 3.2px */\n  --text-card-title-tracking: 0.2em;\n  --text-card-title-leading: 1.0;\n\n  /* ── Body scale (Inter) ───────────────────────── */\n  --text-body: 13.8px;            /* paragraphs; 25.2px line-height */\n  --text-body-leading: 1.83;\n  --text-body-tracking: 0.065em;  /* 0.9px — applied to nearly all Inter text */\n\n  --text-detail: 11.8px;          /* PDP fine print, accordion bodies */\n  --text-detail-leading: 1.82;\n\n  --text-price: 15.3px;           /* prices (weight 500) */\n\n  /* ── Wide-tracked smallcaps (Inter, uppercase) ── */\n  --text-eyebrow: 11.2px;         /* footer column titles */\n  --text-eyebrow-tracking: 0.36em; /* 4.05px */\n\n  --text-button: 11px;            /* button labels */\n  --text-button-tracking: 0.38em; /* 4.2px */\n\n  --text-micro: 9.8px;            /* copyright, countdown sublabel */\n  --text-micro-tracking: 0.09em;\n}\n\n/* Ready-made classes used across cards and kits */\n.mv-display {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: var(--text-hero);\n  line-height: var(--text-hero-leading);\n  letter-spacing: var(--text-hero-tracking);\n  color: var(--text-primary);\n  text-transform: uppercase;\n}\n\n.mv-body {\n  font-family: var(--font-body);\n  font-size: var(--text-body);\n  line-height: var(--text-body-leading);\n  letter-spacing: var(--text-body-tracking);\n  color: var(--text-primary);\n}\n\n.mv-eyebrow {\n  font-family: var(--font-body);\n  font-size: var(--text-eyebrow);\n  letter-spacing: var(--text-eyebrow-tracking);\n  text-transform: uppercase;\n  color: var(--text-primary);\n}\n\n/* Mad Viking Beard Co. — Spacing, radii, effects */\n\n:root {\n  /* ── Layout ───────────────────────────────────── */\n  --page-max: 1500px;\n  --page-pad-x: 40px;\n  --section-gap: 75px;        /* vertical rhythm between sections */\n  --header-gap: 50px;         /* section header → content */\n  --grid-gap: 22px;           /* product grid gutter */\n\n  /* ── Radii — the brand is square-cornered ─────── */\n  --radius-none: 0;           /* default: buttons, cards, badges, inputs */\n  --radius-pill-sm: 3px;      /* tiny nav \"Best Offer\" pill */\n  --radius-drawer: 15px;      /* cart flyout */\n  --radius-bar: 10px;         /* progress bar */\n\n  /* ── The axe-cut (skewed button edges) ────────── */\n  --skew-btn: -12deg;         /* @kind other */ /* matrix(1,0,-0.208,0.978) ≈ skewX(-12°) */\n\n  /* ── Frames & shadows ─────────────────────────── */\n  --frame-inset-white: inset 0 0 0 12px var(--mv-white);  /* promo-grid white frame */\n  --shadow-header: 0 0 1px 0 rgba(0, 0, 0, 0.2);          /* sticky header */\n\n  /* ── Motion ───────────────────────────────────── */\n  --ease-site: ease;          /* @kind other */ /* theme uses simple CSS ease */\n  --dur-fast: 150ms;          /* @kind other */ /* hovers: opacity/color */\n  --dur-med: 300ms;           /* @kind other */ /* drawers, accordions */\n}\n\n/* Mad Viking Beard Co. — base element styles shared by cards & kits */\n\n.mv-page {\n  background: var(--surface-page);\n  color: var(--text-primary);\n  font-family: var(--font-body);\n  font-size: var(--text-body);\n  line-height: var(--text-body-leading);\n  letter-spacing: var(--text-body-tracking);\n}\n\n/* ── Axe-cut button (signature parallelogram) ──────────────\n   Primary: solid red. Ghost: 1px hairline outline.\n   The slanted silhouette comes from a skewed background layer;\n   the label stays unskewed. */\n.mv-btn {\n  position: relative;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  min-width: 90px;\n  height: 42px;\n  padding: 0 20px;\n  border: none;\n  background: transparent;\n  font-family: var(--font-body);\n  font-size: var(--text-button);\n  letter-spacing: var(--text-button-tracking);\n  text-transform: uppercase;\n  text-indent: var(--text-button-tracking); /* optically recenter wide tracking */\n  color: var(--mv-white);\n  cursor: pointer;\n  text-decoration: none;\n  white-space: nowrap;\n}\n.mv-btn::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background: var(--mv-red);\n  transform: skewX(var(--skew-btn));\n  transition: background-color var(--dur-fast) var(--ease-site), opacity var(--dur-fast) var(--ease-site);\n  z-index: -1;\n}\n.mv-btn:hover::before { background: var(--mv-red-deep); }\n.mv-btn:active::before { background: rgb(140, 0, 0); }\n\n.mv-btn--ghost::before {\n  background: transparent;\n  border: 1px solid var(--mv-border);\n}\n.mv-btn--ghost:hover::before { background: rgba(255, 255, 255, 0.06); }\n.mv-btn--ghost:active::before { background: rgba(255, 255, 255, 0.1); }\n.mv-btn--ghost { height: 34px; font-size: 9.6px; letter-spacing: 0.36em; text-indent: 0.36em; }\n\n.mv-btn--straight::before { transform: none; } /* PDP add-to-cart is square */\n\n/* ── Inputs ───────────────────────────────────── */\n.mv-input {\n  height: 43px;\n  padding: 10px 11px;\n  background: transparent;\n  border: var(--border-hairline);\n  border-radius: var(--radius-none);\n  font-family: var(--font-body);\n  font-size: 14.3px;\n  letter-spacing: var(--text-body-tracking);\n  color: var(--mv-white);\n  outline: none;\n}\n.mv-input::placeholder { color: var(--mv-white); opacity: 0.9; }\n.mv-input:focus { border-color: var(--mv-gray-400); }\n\n/* ── Links ────────────────────────────────────── */\n.mv-link {\n  color: var(--mv-white);\n  text-decoration: none;\n  transition: opacity var(--dur-fast) var(--ease-site);\n}\n.mv-link:hover { opacity: 0.7; }\n.mv-link--accent { color: var(--mv-red); }\n\n<\u002Fstyle>\n<script src=\"a3bb49bb-7447-4ead-85e6-941cc47ff238\"><\u002Fscript>\n<style>body{margin:0;background:#000;color:#fff}a{color:#fff;text-decoration:none}a:hover{color:#fff;opacity:.7}select{appearance:none;-webkit-appearance:none}<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"background: var(--mv-black); color: var(--mv-white); font-family: var(--font-body); min-height: 100vh;\">\n  <header style=\"position: sticky; top: 0; z-index: 50; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 60px; padding: 10px 28px 10px 24px; background: var(--mv-black); box-shadow: var(--shadow-header); box-sizing: border-box;\">\n    <a href=\"#\" style=\"display: flex; align-items: flex-start; height: 40px;\"><img src=\"9cad146b-7922-4b90-ab5c-0955c1ac1010\" alt=\"Mad Viking ding: 18px 0; border-bottom: 1px solid var(--mv-border);\">\n                  <img src=\"{{ h.icon }}\" alt=\"\" style=\"width: 36px; height: 38px; object-fit: contain; flex-shrink: 0;\">\n                  <div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0;\">\n                    <span style=\"font-family: var(--font-display); font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;\">{{ h.title }}<\u002Fspan>\n                    <span style=\"font-size: 13px; line-height: 20px; letter-spacing: 0.9px; color: var(--mv-gray-550); text-wrap: pretty;\">{{ h.body }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showRoutine }}\" hint-placeholder-val=\"{{ false }}\">\n          <section style=\"margin-top: 36px; padding: 28px 26px 26px; background: var(--surface-raised); border: 1px solid var(--mv-border); border-top: 2px solid var(--mv-red);\">\n            <h2 style=\"margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; letter-spacing: 0.2em; text-transform: uppercase;\">Product Overview<\u002Fh2>\n            <p style=\"margin: 8px 0 0; font-size: 13.8px; line-height: 25.2px; letter-spacing: 0.9px; color: var(--mv-gray-300); text-wrap: pretty;\">A complete 4-step routine for softer, healthier, itch-free beard hair. Every piece in your choice of 16 scents.<\u002Fp>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 120px), 1fr)); gap: 1px; margin-top: 22px; background: var(--mv-border); border: 1px solid var(--mv-border);\">\n              <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"4\">\n                <div style=\"display: flex; flex-direction: column; gap: 10px; padding: 18px 16px; background: var(--mv-black);\">\n                  <span style=\"font-family: var(--font-display); font-size: 13px; letter-spacing: 0.2em; color: var(--mv-red);\">{{ s.n }}<\u002Fspan>\n                  <span style=\"font-family: var(--font-display); font-size: 17px; letter-spacing: 0.15em; text-transform: uppercase;\">{{ s.verb }}<\u002Fspan>\n                  <span style=\"font-size: 12px; line-height: 18px; letter-spacing: 0.9px; color: var(--mv-gray-550); text-transform: uppercase;\">{{ s.product }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showChecklist }}\" hint-placeholder-val=\"{{ false }}\">\n          <section style=\"margin-top: 36px; padding: 28px 26px 26px; background: var(--surface-raised); border: 1px solid var(--mv-border); border-top: 2px solid var(--mv-red);\">\n            <h2 style=\"margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; letter-spacing: 0.2em; text-transform: uppercase;\">Product Overview<\u002Fh2>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 14px 32px; margin-top: 20px;\">\n              <sc-for list=\"{{ highlights }}\" as=\"h\" hint-placeholder-count=\"6\">\n                <div style=\"display: flex; gap: 12px; align-items: center; font-size: 13px; letter-spacing: 2px; text-transform: uppercase;\">\n                  <img src=\"{{ h.icon }}\" alt=\"\" style=\"width: 26px; height: 28px; object-fit: contain; flex-shrink: 0;\"><span>{{ h.short }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fsc-if>\n\n        <div style=\"margin-top: 40px; font-size: 14.1px; line-height: 29.8px; letter-spacing: 0.9px; font-weight: 700; text-transform: uppercase;\">Mad Viking Wolf Pack<\u002Fdiv>\n        <p style=\"margin: 8px 0 0; font-size: 13.8px; line-height: 25.2px; letter-spacing: 0.9px;\">Score some of our best premium beard care products at a substantial savings!<br>The Mad Viking Wolf Pack is great kit for any aspiring Viking Beardsman. Mad Viking Beard Team tested and approved.<\u002Fp>\n        <p style=\"margin: 22px 0 6px; font-size: 13.8px; letter-spacing: 0.9px; font-weight: 700;\">CONTENTS:<\u002Fp>\n        <ul style=\"margin: 0; padding-left: 30px; display: flex; flex-direction: column; gap: 4px; font-size: 13.8px; line-height: 22px; letter-spacing: 0.9px; font-style: italic;\">\n          <li>2oz Beard Oil<\u002Fli><li>4oz Beard Butter<\u002Fli><li>8oz Biotin Beard Wash<\u002Fli><li>8oz Biotin Beard Conditioner<\u002Fli>\n        <\u002Ful>\n        <p style=\"margin: 18px 0 0; font-size: 13.8px; line-height: 25.2px; letter-spacing: 0.9px; font-style: italic;\">Just pick from 16 different scents for your Beard oil, Beard Butter, Beard Wash and Beard Conditioner! Scent descriptions in the tabs.<\u002Fp>\n\n        <div id=\"scent-profiles\" style=\"margin-top: 34px; display: flex; flex-direction: column;\">\n          <x-import component-from-global-scope=\"MVBDesignSystem_0cf631.Accordion\" title=\"Beard Butter Info &amp; Ingredients\" hint-size=\"100%,56px\">\n            Mad Viking beard butter contains a high content of nutrient rich and moisturizing ingredients. This makes our beard butters one of the most intensely moisturizing beard butters available. They’re chock-full of antioxidants and proteins to help repair your skin and hair.\n            <ul style=\"margin: 14px 0 0; padding-left: 30px; display: flex; flex-direction: column; gap: 5px;\">\n              <li>Mango Butter (Mangifera Indica Seed Butter)<\u002Fli><li>Shea Butter (Butyrospermum Parkii)<\u002Fli><li>Cocoa Butter (Theobroma Cacao Seed Butter)<\u002Fli><li>Jojoba Oil (Simmondsia Chinensis Seed Oil)<\u002Fli><li>Argan Oil (Argania Spinosa Oil)<\u002Fli><li>Abyssinian Oil (Crambe Abyssinica)<\u002Fli><li>Grapeseed Oil (Vitis Vinifera Seed Oil)<\u002Fli><li>Vitamin E Oil (Tocopheryl Acetate)<\u002Fli>\n            <\u002Ful>\n          <\u002Fx-import>\n          <x-import component-from-global-scope=\"MVBDesignSystem_0cf631.Accordion\" title=\"Beard Oil Ingredients\" style=\"margin-top: -1px;\" hint-size=\"100%,56px\">\n            All of our oils contain the following six nutrient rich carrier oils to help maintain, condition, and promote the healthy growth of your beard without looking or feeling greasy. Simply put, Mad Viking Beard Oil is just better for your beard.\n            <ul style=\"margin: 14px 0 0; padding-left: 30px; display: flex; flex-direction: column; gap: 5px;\">\n              <li>Sweet Almond Oil (cold pressed) / Scientific Name: Prunus dulcis<\u002Fli><li>Jojoba Oil Golden Organic (cold pressed) / Scientific Name: Simmondsia chinensis<\u002Fli><li>Argan Oil Virgin (cold pressed) / Scientific Name: Argania spinose<\u002Fli><li>Abyssinian Oil / Scientific Name: Crambe Abyssinica<\u002Fli><li>Grapeseed Oil Organic (cold pressed) / Scientific Name: Vitis vinifera<\u002Fli><li>Vitamin E Oil (Alpha Tocopherol)<\u002Fli>\n            <\u002Ful>\n          <\u002Fx-import>\n          <x-import component-from-global-scope=\"MVBDesignSystem_0cf631.Accordion\" title=\"Scent Profiles\" style=\"margin-top: -1px;\" hint-size=\"100%,56px\">\n            <div style=\"display: flex; flex-direction: column; gap: 8px; text-transform: uppercase;\">\n              <sc-for list=\"{{ profiles }}\" as=\"p\" hint-placeholder-count=\"16\"><div><strong>{{ p.name }}:<\u002Fstrong> {{ p.notes }}<\u002Fdiv><\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fx-import>\n          <x-import component-from-global-scope=\"MVBDesignSystem_0cf631.Accordion\" title=\"Shipping and Return\" style=\"margin-top: -1px;\" hint-size=\"100%,56px\">\n            <strong>Shipping Times:<\u002Fstrong> Orders ship within 24-36 hours, Monday through Saturday. International shipping available; rates vary. For faster delivery, choose DHL.<br><br><strong>Return Policy:<\u002Fstrong
